# Synthetic example only. Authenticate the real host key independently.
- id: vpn-ops
  config:
    allowMutations: false
    allowSecretExport: false
    targets:
      - id: staging-edge
        host: vpn.example.net
        identityFile: /absolute/path/to/dedicated_ed25519
        knownHostsFile: /absolute/path/to/pinned_known_hosts
